<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV比較ツール</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .upload-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .upload-section {
                grid-template-columns: 1fr;
            }
        }

        .drop-zone {
            background: white;
            border: 3px dashed #ccc;
            border-radius: 15px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .drop-zone:hover, .drop-zone.dragover {
            border-color: #667eea;
            background: #f8f9ff;
            transform: scale(1.02);
        }

        .drop-zone.has-file {
            border-color: #4CAF50;
            background: #f0fff0;
        }

        .drop-zone h3 {
            color: #333;
            margin-bottom: 10px;
        }

        .drop-zone p {
            color: #666;
            font-size: 0.9rem;
        }

        .drop-zone .file-name {
            color: #4CAF50;
            font-weight: bold;
            margin-top: 10px;
            word-break: break-all;
        }

        .drop-zone input[type="file"] {
            display: none;
        }

        .options {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .options label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }

        .options input {
            width: 100%;
            max-width: 300px;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
        }

        .options input:focus {
            outline: none;
            border-color: #667eea;
        }

        .compare-btn {
            display: block;
            width: 100%;
            max-width: 300px;
            margin: 0 auto 30px;
            padding: 15px 40px;
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
        }

        .compare-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.4);
        }

        .compare-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            box-shadow: none;
        }

        .results {
            background: white;
            border-radius: 15px;
            padding: 25px;
            display: none;
        }

        .results.show {
            display: block;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .summary-item {
            text-align: center;
            padding: 20px;
            border-radius: 10px;
            color: white;
        }

        .summary-item.added { background: linear-gradient(135deg, #4CAF50, #45a049); }
        .summary-item.deleted { background: linear-gradient(135deg, #f44336, #d32f2f); }
        .summary-item.modified { background: linear-gradient(135deg, #ff9800, #f57c00); }
        .summary-item.unchanged { background: linear-gradient(135deg, #9e9e9e, #757575); }

        .summary-item .count {
            font-size: 2.5rem;
            font-weight: bold;
        }

        .summary-item .label {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .diff-section {
            margin-top: 25px;
        }

        .diff-section h3 {
            padding: 15px;
            border-radius: 10px 10px 0 0;
            color: white;
            margin-bottom: 0;
        }

        .diff-section h3.added { background: #4CAF50; }
        .diff-section h3.deleted { background: #f44336; }
        .diff-section h3.modified { background: #ff9800; }

        .diff-content {
            border: 1px solid #ddd;
            border-top: none;
            border-radius: 0 0 10px 10px;
            overflow: hidden;
        }

        .diff-row {
            padding: 15px;
            border-bottom: 1px solid #eee;
            background: #fafafa;
        }

        .diff-row:last-child {
            border-bottom: none;
        }

        .diff-row:nth-child(even) {
            background: white;
        }

        .row-data {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .row-data span {
            background: #e3f2fd;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.9rem;
        }

        .change-item {
            margin: 10px 0;
            padding: 10px;
            background: #fff3e0;
            border-radius: 8px;
        }

        .change-item .key {
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .change-detail {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .change-detail .column {
            font-weight: 500;
            color: #666;
        }

        .change-detail .old-value {
            background: #ffcdd2;
            padding: 3px 8px;
            border-radius: 4px;
            text-decoration: line-through;
        }

        .change-detail .arrow {
            color: #666;
        }

        .change-detail .new-value {
            background: #c8e6c9;
            padding: 3px 8px;
            border-radius: 4px;
        }

        .no-diff {
            text-align: center;
            padding: 40px;
            color: #4CAF50;
            font-size: 1.2rem;
        }

        .error {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>CSV比較ツール</h1>

        <div class="upload-section">
            <div class="drop-zone" id="dropZone1">
                <h3>ファイル1（比較元）</h3>
                <p>クリックまたはドラッグ&ドロップ</p>
                <p class="file-name" id="fileName1"></p>
                <input type="file" id="file1" accept=".csv">
            </div>

            <div class="drop-zone" id="dropZone2">
                <h3>ファイル2（比較先）</h3>
                <p>クリックまたはドラッグ&ドロップ</p>
                <p class="file-name" id="fileName2"></p>
                <input type="file" id="file2" accept=".csv">
            </div>
        </div>

        <div class="options">
            <label for="keyColumn">キー列名（空欄の場合は最初の列を使用）:</label>
            <input type="text" id="keyColumn" placeholder="例: id">
        </div>

        <button class="compare-btn" id="compareBtn" disabled>比較する</button>

        <div class="results" id="results"></div>
    </div>

    <script>
        const dropZone1 = document.getElementById('dropZone1');
        const dropZone2 = document.getElementById('dropZone2');
        const file1Input = document.getElementById('file1');
        const file2Input = document.getElementById('file2');
        const fileName1 = document.getElementById('fileName1');
        const fileName2 = document.getElementById('fileName2');
        const compareBtn = document.getElementById('compareBtn');
        const results = document.getElementById('results');

        let selectedFile1 = null;
        let selectedFile2 = null;

        // ドロップゾーンの設定
        function setupDropZone(dropZone, fileInput, fileNameEl, setFile) {
            dropZone.addEventListener('click', () => fileInput.click());

            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.classList.add('dragover');
            });

            dropZone.addEventListener('dragleave', () => {
                dropZone.classList.remove('dragover');
            });

            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('dragover');
                const file = e.dataTransfer.files[0];
                if (file && file.name.endsWith('.csv')) {
                    setFile(file);
                    fileNameEl.textContent = file.name;
                    dropZone.classList.add('has-file');
                }
            });

            fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    setFile(file);
                    fileNameEl.textContent = file.name;
                    dropZone.classList.add('has-file');
                }
            });
        }

        setupDropZone(dropZone1, file1Input, fileName1, (f) => {
            selectedFile1 = f;
            updateCompareButton();
        });

        setupDropZone(dropZone2, file2Input, fileName2, (f) => {
            selectedFile2 = f;
            updateCompareButton();
        });

        function updateCompareButton() {
            compareBtn.disabled = !(selectedFile1 && selectedFile2);
        }

        // 比較実行
        compareBtn.addEventListener('click', async () => {
            if (!selectedFile1 || !selectedFile2) return;

            const formData = new FormData();
            formData.append('file1', selectedFile1);
            formData.append('file2', selectedFile2);
            formData.append('key_column', document.getElementById('keyColumn').value);

            results.innerHTML = '<div class="loading"><span class="spinner"></span>比較中...</div>';
            results.classList.add('show');

            try {
                const response = await fetch('/compare', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.error) {
                    results.innerHTML = `<div class="error">${data.error}</div>`;
                    return;
                }

                renderResults(data.result);
            } catch (error) {
                results.innerHTML = `<div class="error">エラーが発生しました: ${error.message}</div>`;
            }
        });

        function renderResults(result) {
            const { added_rows, deleted_rows, modified_rows, unchanged_count, headers1, headers2, key_column } = result;
            const totalChanges = added_rows.length + deleted_rows.length + modified_rows.length;

            let html = `
                <div class="summary">
                    <div class="summary-item added">
                        <div class="count">${added_rows.length}</div>
                        <div class="label">追加</div>
                    </div>
                    <div class="summary-item deleted">
                        <div class="count">${deleted_rows.length}</div>
                        <div class="label">削除</div>
                    </div>
                    <div class="summary-item modified">
                        <div class="count">${modified_rows.length}</div>
                        <div class="label">変更</div>
                    </div>
                    <div class="summary-item unchanged">
                        <div class="count">${unchanged_count}</div>
                        <div class="label">変更なし</div>
                    </div>
                </div>
            `;

            if (totalChanges === 0) {
                html += '<div class="no-diff">差分はありません</div>';
            } else {
                // 追加された行
                if (added_rows.length > 0) {
                    html += `
                        <div class="diff-section">
                            <h3 class="added">追加された行 (${added_rows.length}件)</h3>
                            <div class="diff-content">
                                ${added_rows.map(row => `
                                    <div class="diff-row">
                                        <div class="row-data">
                                            ${Object.entries(row).map(([k, v]) => `<span><b>${k}:</b> ${v}</span>`).join('')}
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                }

                // 削除された行
                if (deleted_rows.length > 0) {
                    html += `
                        <div class="diff-section">
                            <h3 class="deleted">削除された行 (${deleted_rows.length}件)</h3>
                            <div class="diff-content">
                                ${deleted_rows.map(row => `
                                    <div class="diff-row">
                                        <div class="row-data">
                                            ${Object.entries(row).map(([k, v]) => `<span><b>${k}:</b> ${v}</span>`).join('')}
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                }

                // 変更された行
                if (modified_rows.length > 0) {
                    html += `
                        <div class="diff-section">
                            <h3 class="modified">変更された行 (${modified_rows.length}件)</h3>
                            <div class="diff-content">
                                ${modified_rows.map(item => `
                                    <div class="diff-row">
                                        <div class="change-item">
                                            <div class="key">キー: ${key_column} = ${item.key}</div>
                                            ${item.changed_columns.map(change => `
                                                <div class="change-detail">
                                                    <span class="column">${change.column}:</span>
                                                    <span class="old-value">${change.old_value || '(空)'}</span>
                                                    <span class="arrow">→</span>
                                                    <span class="new-value">${change.new_value || '(空)'}</span>
                                                </div>
                                            `).join('')}
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                }
            }

            results.innerHTML = html;
        }
    </script>
</body>
</html>
